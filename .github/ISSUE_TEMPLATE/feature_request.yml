name: Feature request
description: Suggest an idea for GoProBuddy
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: I shoot timelapses and have to download hundreds of photos one group at a time…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: input
    id: camera
    attributes:
      label: Your camera model
      placeholder: HERO12 Black
