# Builds GoProBuddy for Windows, macOS and Linux on every push and pull request.
# Pushing a tag like v0.2.0 also publishes a GitHub release with all the downloads attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/...

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}; else VERSION=dev-${GITHUB_SHA::7}; fi
          go build -trimpath -ldflags="-H=windowsgui -s -w -X main.appVersion=$VERSION" -o GoProBuddy.exe .
          mkdir dist && mv GoProBuddy.exe dist/ && cp README.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: GoProBuddy-windows-${{ matrix.arch }}
          path: dist/

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build universal binary
        env:
          CGO_ENABLED: "1"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}; else VERSION=dev-${GITHUB_SHA::7}; fi
          for arch in arm64 amd64; do
            GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.appVersion=$VERSION" -o GoProBuddy-$arch .
          done
          lipo -create -output GoProBuddy GoProBuddy-arm64 GoProBuddy-amd64
      - name: Make GoProBuddy.app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}; else VERSION=dev-${GITHUB_SHA::7}; fi
          APP=dist/GoProBuddy.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mv GoProBuddy "$APP/Contents/MacOS/GoProBuddy"
          sed "s/VERSION/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          ICONSET=GoProBuddy.iconset && mkdir $ICONSET
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/logo-mark.png --out $ICONSET/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/logo-mark.png --out $ICONSET/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns $ICONSET -o "$APP/Contents/Resources/GoProBuddy.icns"
          codesign --force --deep --sign - "$APP" # ad-hoc signature; required on Apple Silicon
          cd dist && ditto -c -k --keepParent GoProBuddy.app GoProBuddy-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GoProBuddy-macos-universal
          path: dist/GoProBuddy-macos.zip

  linux:
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Gio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}; else VERSION=dev-${GITHUB_SHA::7}; fi
          go build -trimpath -ldflags="-s -w -X main.appVersion=$VERSION" -o goprobuddy .
          D=GoProBuddy-linux-${{ matrix.arch }}
          mkdir -p dist/$D
          mv goprobuddy dist/$D/
          cp assets/logo-mark.png dist/$D/goprobuddy.png
          cp packaging/linux/goprobuddy.desktop packaging/linux/install.sh README.md dist/$D/
          chmod +x dist/$D/install.sh
          tar -C dist -czf dist/$D.tar.gz $D
      - uses: actions/upload-artifact@v4
        with:
          name: GoProBuddy-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip the Windows builds
        run: |
          cd artifacts
          for a in amd64 arm64; do (cd GoProBuddy-windows-$a && zip -r ../GoProBuddy-windows-$a.zip .); done
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/GoProBuddy-windows-*.zip
            artifacts/GoProBuddy-macos-universal/GoProBuddy-macos.zip
            artifacts/GoProBuddy-linux-*/*.tar.gz
